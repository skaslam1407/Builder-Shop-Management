[package]
name = "builder-shop-management"
version = "0.1.0"
description = "Offline-first construction material management and billing system"
authors = ["Builder Shop Management"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "builder_shop_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
